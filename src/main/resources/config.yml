item-hover:
  enabled: false
  formats:
    empty: '<yellow>Nothing!'
    single: '<dark_gray>[<white><item></white>]</dark_gray>'
    multiple: '<dark_gray>[<aqua>x<amount></aqua><white><item></white>]</dark_gray>'
  replacements:
    - '[i]'
    - '[item]'
    - '[hand]'
    - '[showitem]'

channel-settings:
  default: 'global'
  channels:
    global:
      permission: 'simplychat.channel.global'
    staff:
      permission: 'simplychat.channel.staff'
    admin:
      permission: 'simplychat.channel.admin'